<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>MER — Garantías</title>
  <desc>guarantees es la cabecera; tiene items e history (CASCADE), auto-ref parent; referencia companies/branches/users. counters, exports y sync_logs son tablas de apoyo.</desc>
  <style>
    .ent{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;} .hub{fill:#ffffff;stroke:#d97706;stroke-width:2.5;}
    .hdr{fill:#d97706;} .ref{fill:#94a3b8;} .aux{fill:#a3a3a3;} .ttl{fill:#fff;font-size:13px;font-weight:700;}
    .fld{fill:#1e293b;font-size:11px;} .key{fill:#64748b;font-size:9.5px;font-weight:700;}
    .rel{stroke:#94a3b8;stroke-width:1.5;fill:none;} .card{fill:#64748b;font-size:11px;font-weight:700;} .note{fill:#64748b;font-size:10px;}
  </style>
  <path class="rel" d="M160,95 q100,20 140,60"/><text class="card" x="170" y="92">1</text><text class="card" x="288" y="150">N</text>
  <path class="rel" d="M160,330 q90,-20 140,-60"/><text class="card" x="170" y="332">1</text><text class="card" x="288" y="270">N</text>
  <path class="rel" d="M500,150 H560"/><text class="card" x="510" y="143">1</text><text class="card" x="545" y="143">N</text>
  <path class="rel" d="M500,240 H560"/><text class="card" x="510" y="233">1</text><text class="card" x="545" y="233">N</text>
  <path class="rel" d="M460,300 q40,0 40,30 q0,30 -40,30"/><text class="note" x="505" y="335">parent ↺</text>
  <!-- referenced -->
  <g><rect class="ent" x="20" y="60" width="140" height="60" rx="8"/><path class="ref" d="M20,68 a8,8 0 0 1 8,-8 h124 a8,8 0 0 1 8,8 v16 h-140 z"/><text class="ttl" x="30" y="80">companies</text><text class="note" x="30" y="106">RESTRICT</text></g>
  <g><rect class="ent" x="20" y="180" width="140" height="74" rx="8"/><path class="ref" d="M20,188 a8,8 0 0 1 8,-8 h124 a8,8 0 0 1 8,8 v16 h-140 z"/><text class="ttl" x="30" y="200">branches</text><text class="note" x="30" y="226">branch +</text><text class="note" x="30" y="242">sucursal_responsable</text></g>
  <g><rect class="ent" x="20" y="300" width="140" height="60" rx="8"/><path class="ref" d="M20,308 a8,8 0 0 1 8,-8 h124 a8,8 0 0 1 8,8 v16 h-140 z"/><text class="ttl" x="30" y="320">users</text><text class="note" x="30" y="346">responsable/actores</text></g>
  <!-- guarantees hub -->
  <g><rect class="hub" x="300" y="120" width="200" height="180" rx="8"/><path class="hdr" d="M300,128 a8,8 0 0 1 8,-8 h184 a8,8 0 0 1 8,8 v18 h-200 z"/><text class="ttl" x="312" y="140">guarantees</text><text class="key" x="312" y="164">PK</text><text class="fld" x="335" y="164">id</text><text class="fld" x="312" y="182">warranty_code (UNIQUE)</text><text class="key" x="312" y="200">FK</text><text class="fld" x="335" y="200">parent_id ↺</text><text class="fld" x="312" y="218">company_id · branch_id</text><text class="fld" x="312" y="236">status · review_status</text><text class="fld" x="312" y="254">provider · resolución</text><text class="fld" x="312" y="272">carga_historica</text><text class="fld" x="312" y="290">cancelled</text></g>
  <!-- items / history -->
  <g><rect class="ent" x="560" y="110" width="210" height="78" rx="8"/><path class="hdr" d="M560,118 a8,8 0 0 1 8,-8 h194 a8,8 0 0 1 8,8 v18 h-210 z"/><text class="ttl" x="572" y="130">guarantee_items</text><text class="key" x="572" y="154">FK</text><text class="fld" x="595" y="154">guarantee_id (CASCADE)</text><text class="fld" x="572" y="172">producto · serie · falla</text></g>
  <g><rect class="ent" x="560" y="200" width="210" height="78" rx="8"/><path class="hdr" d="M560,208 a8,8 0 0 1 8,-8 h194 a8,8 0 0 1 8,8 v18 h-210 z"/><text class="ttl" x="572" y="220">guarantee_history</text><text class="key" x="572" y="244">FK</text><text class="fld" x="595" y="244">guarantee_id (CASCADE)</text><text class="fld" x="572" y="262">action · details [jsonb]</text></g>
  <!-- aux -->
  <g><rect class="ent" x="300" y="360" width="200" height="74" rx="8"/><path class="aux" d="M300,368 a8,8 0 0 1 8,-8 h184 a8,8 0 0 1 8,8 v16 h-200 z"/><text class="ttl" x="312" y="380">guarantee_counters</text><text class="key" x="312" y="404">PK</text><text class="fld" x="335" y="404">(year, sucursal_code)</text><text class="fld" x="312" y="422">last_number · FOR UPDATE</text></g>
  <g><rect class="ent" x="560" y="300" width="210" height="62" rx="8"/><path class="aux" d="M560,308 a8,8 0 0 1 8,-8 h194 a8,8 0 0 1 8,8 v16 h-210 z"/><text class="ttl" x="572" y="320">guarantee_exports</text><text class="fld" x="572" y="344">warranty_ids/filters [jsonb]</text></g>
  <g><rect class="ent" x="560" y="375" width="210" height="58" rx="8"/><path class="aux" d="M560,383 a8,8 0 0 1 8,-8 h194 a8,8 0 0 1 8,8 v16 h-210 z"/><text class="ttl" x="572" y="395">guarantee_sync_logs</text><text class="fld" x="572" y="419">errors [jsonb]</text></g>
  <text class="note" x="20" y="500">Notación: 1 — N · ↺ auto-ref. Naranja = cabecera. Gris claro = tablas de apoyo (contador / exports / logs).</text>
  <text class="note" x="20" y="518">Dominio 3 · Garantías (6 tablas).</text>
</svg>
