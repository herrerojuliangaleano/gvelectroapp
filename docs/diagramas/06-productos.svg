<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>MER — Productos (legacy)</title>
  <desc>product_brands N–N providers vía brand_providers; products referencia catalog_products (puente al maestro); product_sync_logs registra el sync.</desc>
  <style>
    .ent{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;} .hub{fill:#ffffff;stroke:#db2777;stroke-width:2.5;}
    .hdr{fill:#db2777;} .jhdr{fill:#64748b;} .ref{fill:#94a3b8;} .ttl{fill:#fff;font-size:13px;font-weight:700;}
    .fld{fill:#1e293b;font-size:11px;} .key{fill:#64748b;font-size:9.5px;font-weight:700;}
    .rel{stroke:#94a3b8;stroke-width:1.5;fill:none;} .card{fill:#64748b;font-size:11px;font-weight:700;} .note{fill:#64748b;font-size:10px;}
  </style>
  <path class="rel" d="M210,150 H300"/><text class="card" x="220" y="143">1</text><text class="card" x="285" y="143">N</text>
  <path class="rel" d="M470,150 H560"/><text class="card" x="475" y="143">N</text><text class="card" x="545" y="143">1</text>
  <path class="rel" d="M150,200 V300"/><text class="note" x="156" y="255">catalog_product_id</text>
  <g><rect class="ent" x="20" y="100" width="190" height="100" rx="8"/><path class="hdr" d="M20,108 a8,8 0 0 1 8,-8 h174 a8,8 0 0 1 8,8 v18 h-190 z"/><text class="ttl" x="32" y="120">product_brands</text><text class="key" x="32" y="144">PK</text><text class="fld" x="55" y="144">id</text><text class="fld" x="32" y="162">name</text><text class="fld" x="32" y="180">normalized_name (UNIQUE)</text></g>
  <g><rect class="ent" x="300" y="100" width="170" height="100" rx="8"/><path class="jhdr" d="M300,108 a8,8 0 0 1 8,-8 h154 a8,8 0 0 1 8,8 v18 h-170 z"/><text class="ttl" x="312" y="120">brand_providers</text><text class="key" x="312" y="144">FK</text><text class="fld" x="335" y="144">brand_id</text><text class="fld" x="312" y="162">provider_id</text><text class="fld" x="312" y="184">is_default · UNIQUE</text></g>
  <g><rect class="ent" x="560" y="100" width="190" height="100" rx="8"/><path class="hdr" d="M560,108 a8,8 0 0 1 8,-8 h174 a8,8 0 0 1 8,8 v18 h-190 z"/><text class="ttl" x="572" y="120">providers</text><text class="key" x="572" y="144">PK</text><text class="fld" x="595" y="144">id</text><text class="fld" x="572" y="162">normalized_name (UNIQUE)</text><text class="fld" x="572" y="180">contacto · email</text></g>
  <g><rect class="hub" x="20" y="300" width="260" height="100" rx="8"/><path class="hdr" d="M20,308 a8,8 0 0 1 8,-8 h244 a8,8 0 0 1 8,8 v18 h-260 z"/><text class="ttl" x="32" y="320">products  (legacy)</text><text class="fld" x="32" y="344">sku · sku_normalized (UNIQUE)</text><text class="fld" x="32" y="362">marca · tipo · pvp · costo_vigente</text><text class="key" x="32" y="380">FK</text><text class="fld" x="55" y="380">catalog_product_id → maestro (SET NULL)</text></g>
  <g><rect class="ent" x="560" y="300" width="190" height="84" rx="8"/><path class="ref" d="M560,308 a8,8 0 0 1 8,-8 h174 a8,8 0 0 1 8,8 v18 h-190 z"/><text class="ttl" x="572" y="320">product_sync_logs</text><text class="fld" x="572" y="344">contadores · errors [jsonb]</text><text class="fld" x="572" y="362">sync con Google Sheets</text></g>
  <text class="note" x="20" y="412">Dominio 6 · Productos legacy (5 tablas). Rosa = entidades centrales · gris medio = N–N · catalog_product_id = puente al Catálogo Maestro.</text>
</svg>
