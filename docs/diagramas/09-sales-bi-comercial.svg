<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>MER — Sales BI comercial (Ventas vs Costos)</title>
  <desc>batches tiene records (CASCADE); records referencia corrections (SET NULL), products y branches.</desc>
  <style>
    .ent{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;} .hub{fill:#ffffff;stroke:#16a34a;stroke-width:2.5;}
    .hdr{fill:#16a34a;} .ref{fill:#94a3b8;} .ttl{fill:#fff;font-size:13px;font-weight:700;}
    .fld{fill:#1e293b;font-size:11px;} .key{fill:#64748b;font-size:9.5px;font-weight:700;}
    .rel{stroke:#94a3b8;stroke-width:1.5;fill:none;} .card{fill:#64748b;font-size:11px;font-weight:700;} .note{fill:#64748b;font-size:10px;}
  </style>
  <path class="rel" d="M250,150 H360"/><text class="card" x="260" y="143">1</text><text class="card" x="345" y="143">N</text>
  <path class="rel" d="M450,250 V300"/><text class="card" x="456" y="270">N</text><text class="card" x="456" y="298">1</text>
  <path class="rel" d="M560,170 H680"/><text class="note" x="580" y="163">product_id / branch_id</text>
  <g><rect class="hub" x="50" y="90" width="200" height="120" rx="8"/><path class="hdr" d="M50,98 a8,8 0 0 1 8,-8 h184 a8,8 0 0 1 8,8 v18 h-200 z"/><text class="ttl" x="62" y="110">..._commercial_batches</text><text class="key" x="62" y="134">PK</text><text class="fld" x="85" y="134">id</text><text class="fld" x="62" y="152">source · period_start/end</text><text class="fld" x="62" y="170">totales · status</text><text class="fld" x="62" y="188">warnings [jsonb]</text></g>
  <g><rect class="ent" x="360" y="90" width="200" height="150" rx="8"/><path class="hdr" d="M360,98 a8,8 0 0 1 8,-8 h184 a8,8 0 0 1 8,8 v18 h-200 z"/><text class="ttl" x="372" y="110">..._commercial_records</text><text class="key" x="372" y="134">FK</text><text class="fld" x="395" y="134">batch_id (CASCADE)</text><text class="fld" x="372" y="152">fecha · sucursal · categoria</text><text class="fld" x="372" y="170">marca/sku (raw + norm)</text><text class="fld" x="372" y="188">product_id · correction_id</text><text class="fld" x="372" y="206">cantidad · pvp · costo</text><text class="fld" x="372" y="224">diferencia · margen</text></g>
  <g><rect class="ent" x="350" y="300" width="220" height="74" rx="8"/><path class="hdr" d="M350,308 a8,8 0 0 1 8,-8 h204 a8,8 0 0 1 8,8 v16 h-220 z"/><text class="ttl" x="362" y="320">..._commercial_corrections</text><text class="fld" x="362" y="344">match_*_norm · corrected_*</text><text class="fld" x="362" y="362">product_id (SET NULL)</text></g>
  <g><rect class="ent" x="680" y="120" width="190" height="80" rx="8"/><path class="ref" d="M680,128 a8,8 0 0 1 8,-8 h174 a8,8 0 0 1 8,8 v16 h-190 z"/><text class="ttl" x="692" y="140">products / branches</text><text class="note" x="692" y="166">otro dominio</text><text class="note" x="692" y="184">SET NULL</text></g>
  <text class="note" x="20" y="392">Dominio 9 · Sales BI comercial (3 tablas). Prefijo real: sales_bi_commercial_*. Verde = entidades del dominio.</text>
</svg>
