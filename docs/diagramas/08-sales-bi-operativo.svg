<svg viewBox="0 0 920 440" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>MER — Sales BI (operativo)</title>
  <desc>sales_imports tiene sales_records y sales_balances (CASCADE); sales_records referencia products y sales_bi_product_aliases.</desc>
  <style>
    .ent{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;} .hub{fill:#ffffff;stroke:#0ea5e9;stroke-width:2.5;}
    .hdr{fill:#0ea5e9;} .ref{fill:#94a3b8;} .ttl{fill:#fff;font-size:13px;font-weight:700;}
    .fld{fill:#1e293b;font-size:11px;} .key{fill:#64748b;font-size:9.5px;font-weight:700;}
    .rel{stroke:#94a3b8;stroke-width:1.5;fill:none;} .card{fill:#64748b;font-size:11px;font-weight:700;} .note{fill:#64748b;font-size:10px;}
  </style>
  <path class="rel" d="M250,150 H360"/><text class="card" x="260" y="143">1</text><text class="card" x="345" y="143">N</text>
  <path class="rel" d="M180,200 q-20,80 0,120 q10,30 70,30"/><text class="card" x="120" y="280">1</text><text class="card" x="240" y="358">N</text>
  <path class="rel" d="M560,180 q120,20 150,50"/><text class="note" x="575" y="195">product_id</text>
  <path class="rel" d="M560,210 q120,60 150,110"/><text class="note" x="575" y="270">alias_id</text>
  <g><rect class="hub" x="50" y="90" width="200" height="120" rx="8"/><path class="hdr" d="M50,98 a8,8 0 0 1 8,-8 h184 a8,8 0 0 1 8,8 v18 h-200 z"/><text class="ttl" x="62" y="110">sales_imports</text><text class="key" x="62" y="134">PK</text><text class="fld" x="85" y="134">id</text><text class="fld" x="62" y="152">fecha · sucursal · tipo</text><text class="fld" x="62" y="170">status · totales (pagos)</text><text class="fld" x="62" y="188">warnings [jsonb]</text></g>
  <g><rect class="ent" x="360" y="90" width="200" height="170" rx="8"/><path class="hdr" d="M360,98 a8,8 0 0 1 8,-8 h184 a8,8 0 0 1 8,8 v18 h-200 z"/><text class="ttl" x="372" y="110">sales_records</text><text class="key" x="372" y="134">FK</text><text class="fld" x="395" y="134">import_id (CASCADE)</text><text class="fld" x="372" y="152">remito · vendedor (+norm)</text><text class="fld" x="372" y="170">seller_user_id</text><text class="fld" x="372" y="188">sku (+norm) · product_id</text><text class="fld" x="372" y="206">product_alias_id</text><text class="fld" x="372" y="224">categoria · cantidad</text><text class="fld" x="372" y="242">pvp/costo/pagos/saldo</text></g>
  <g><rect class="ent" x="60" y="320" width="190" height="70" rx="8"/><path class="hdr" d="M60,328 a8,8 0 0 1 8,-8 h174 a8,8 0 0 1 8,8 v16 h-190 z"/><text class="ttl" x="72" y="340">sales_balances</text><text class="fld" x="72" y="364">import_id (CASCADE)</text><text class="fld" x="72" y="382">remito · montos por pago</text></g>
  <g><rect class="ent" x="710" y="100" width="190" height="70" rx="8"/><path class="ref" d="M710,108 a8,8 0 0 1 8,-8 h174 a8,8 0 0 1 8,8 v16 h-190 z"/><text class="ttl" x="722" y="120">products</text><text class="note" x="722" y="146">match (SET NULL)</text></g>
  <g><rect class="ent" x="710" y="280" width="200" height="76" rx="8"/><path class="hdr" d="M710,288 a8,8 0 0 1 8,-8 h184 a8,8 0 0 1 8,8 v16 h-200 z"/><text class="ttl" x="722" y="300">sales_bi_product_aliases</text><text class="fld" x="722" y="324">alias_sku_norm / desc_norm</text><text class="fld" x="722" y="342">product_id (CASCADE)</text></g>
  <text class="note" x="20" y="420">Dominio 8 · Sales BI operativo (4 tablas). Celeste = entidades del dominio · gris = otro dominio (products).</text>
</svg>
