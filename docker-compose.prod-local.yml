# ElectroGV - mini produccion local (Vercel + ngrok)
#
# Este compose queda aislado del compose de desarrollo:
# - backend-prod publica en localhost:${PROD_BACKEND_PORT:-8010}
# - postgres-prod publica en localhost:${PROD_POSTGRES_PORT:-5433}
# - adminer-prod publica en localhost:${PROD_ADMINER_PORT:-8081}
# - storage persistente: ./backend/storage-prod
# - backups persistentes: ./backend/backups-prod
#
# Usar siempre con:
#   docker compose --env-file backend/.env.production.local -f docker-compose.prod-local.yml up -d --build

services:
  # Túnel Cloudflare: expone el backend en tu dominio, sin abrir puertos ni IP
  # pública (funciona detrás de CGNAT). El token va en
  # backend/.env.production.local -> CLOUDFLARE_TUNNEL_TOKEN=... (gitignoreado).
  # En el dashboard del túnel, Public Hostname -> Service: http://electrogv-backend-prod:8000
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: electrogv-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend-prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend-prod:
    build: ./backend
    image: electrogv-backend:prod-local
    container_name: electrogv-backend-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.production.local
    environment:
      STORAGE_DIR: /app/storage
      PORT: "8000"
      DATABASE_URL: "postgresql+psycopg://${PROD_POSTGRES_USER:-electrogv}:${PROD_POSTGRES_PASSWORD:-CAMBIAR_PASSWORD_DB_PROD}@postgres-prod:5432/${PROD_POSTGRES_DB:-electrogv}"
      # Scheduler de tareas automáticas: activo en prod-local (sync nocturno
      # de catálogo a las 03:30 ART). En dev queda apagado (default false).
      SCHEDULER_ENABLED: "true"
    ports:
      - "127.0.0.1:${PROD_BACKEND_PORT:-8010}:8000"
    volumes:
      - ./backend/storage-prod:/app/storage
      # El frontend buildeado se monta desde el host: así SIEMPRE está presente
      # al arrancar (main.py registra las rutas del SPA solo si existe al boot)
      # y no se pierde en cada recreate/restart del contenedor.
      - ./frontend/dist:/frontend/dist:ro
    depends_on:
      postgres-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres-prod:
    image: postgres:16-alpine
    container_name: electrogv-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PROD_POSTGRES_USER:-electrogv}
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD:-CAMBIAR_PASSWORD_DB_PROD}
      POSTGRES_DB: ${PROD_POSTGRES_DB:-electrogv}
    volumes:
      - pgdata-prod-local:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PROD_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_POSTGRES_USER:-electrogv} -d ${PROD_POSTGRES_DB:-electrogv}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  adminer-prod:
    image: adminer:latest
    container_name: electrogv-adminer-prod
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres-prod
      ADMINER_DESIGN: pepa-linha-dark
    ports:
      - "127.0.0.1:${PROD_ADMINER_PORT:-8081}:8080"
    depends_on:
      postgres-prod:
        condition: service_healthy

  db-backup-prod:
    image: prodrigestivill/postgres-backup-local:16
    container_name: electrogv-db-backup-prod
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres-prod
      POSTGRES_DB: ${PROD_POSTGRES_DB:-electrogv}
      POSTGRES_USER: ${PROD_POSTGRES_USER:-electrogv}
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD:-CAMBIAR_PASSWORD_DB_PROD}
      POSTGRES_EXTRA_OPTS: "--format=custom --blobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
      HEALTHCHECK_PORT: 8181
    volumes:
      - ./backend/backups-prod:/backups
    depends_on:
      postgres-prod:
        condition: service_healthy

volumes:
  pgdata-prod-local:
    name: electrogv-prod-pgdata-local
